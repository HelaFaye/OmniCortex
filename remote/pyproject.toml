[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicortex-remote"
version = "0.1.0"
description = "Let OmniCortex (or any MCP client) control the LLMs on this computer: LM Studio, Ollama, llama.cpp."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
tls = ["cryptography>=41"]

[project.scripts]
omnicortex-remote = "omnicortex_remote.agent:main"

[tool.setuptools]
packages = ["omnicortex_remote"]
