name: android

# Builds the Kivy client's APK (clients/kivy/buildozer.spec) when the client changes, or on demand.
on:
  push:
    paths: ["clients/kivy/**", "tests/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev ccache
          pip install buildozer==1.5.0 cython==3.0.11
      - name: Cache the Android SDK, NDK and python-for-android
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('clients/kivy/buildozer.spec') }}
      - name: Build the APK
        working-directory: clients/kivy
        run: yes | buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: omnicortex-android-apk
          path: clients/kivy/bin/*.apk
          if-no-files-found: error

  # The app in an Android emulator: an x86_64 build of the same spec, its self-test driving every screen against
  # tests/android/fake_studio.py (pinned TLS, streamed chat, each reply check, the QR scanner), screenshots kept.
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev ccache
          pip install buildozer==1.5.0 cython==3.0.11 cryptography
      - name: Cache the Android SDK, NDK and python-for-android
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-x86_64-${{ hashFiles('clients/kivy/buildozer.spec') }}
      - name: Build the APK for the emulator (x86_64)
        working-directory: clients/kivy
        env:
          APP_ANDROID_ARCHS: x86_64
        run: yes | buildozer android debug
      - name: Run the self-test in the emulator
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          api-level: 33
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/android/run_selftest.sh "$(ls clients/kivy/bin/*.apk | head -1)" emulator-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnicortex-android-emulator-run
          path: emulator-out/
